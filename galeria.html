<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Artistas Archiv</title>
    <link rel="icon" type="image/png" href="logo-2.png">

    <style>
        :root {
            --negro-fondo: #0a050d;
            --blanco: #ffffff;
            --violeta-neon: #a855f7;
            --rojo-neon: #ff2a00;
        }

        body {
            background-color: var(--negro-fondo);
            background-image: linear-gradient(rgba(10, 5, 13, 0.85), rgba(10, 5, 13, 0.85)), 
                              url('https://static.vecteezy.com/system/resources/thumbnails/020/171/692/small/fire-liquid-iridescent-background-iridescent-chrome-wavy-gradient-abstract-background-holographic-fire-texture-liquid-surface-ripples-reflection-photo.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--blanco);
            overflow-x: hidden;
            padding-bottom: 100px;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
        }

        .carrusel-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
            color: white; width: 50px; height: 50px; border-radius: 50%;
            cursor: pointer; font-size: 18px; transition: 0.3s; z-index: 10;
        }

        .carrusel-btn:hover {
            background: var(--rojo-neon); color: #000;
            box-shadow: 0 0 15px var(--rojo-neon);
        }

        .btn-prev { left: 20px; }
        .btn-next { right: 20px; }

        .seccion-carrusel {
            margin-top: 140px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .titulo-seccion {
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-align: center;
            color: var(--blanco);
            text-shadow: 0 0 10px rgba(255, 42, 0, 0.5);
        }

        /* MARCO DEL CARRUSEL */
        .carrusel-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 520px;
            overflow: hidden;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 30px rgba(255, 42, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.5);
        }

        /* CORREGIDO: Ancho exacto para 7 slides (700%) */
        .carrusel-track {
            display: flex;
            width: 700%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.76, 0, 0.24, 1);
        }

        .carrusel-slide {
            width: 100%; 
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carrusel-slide img, 
        .carrusel-slide video {
            width: 100%; 
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        .slide-info {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 40px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex; justify-content: space-between; align-items: flex-end;
            box-sizing: border-box;
            pointer-events: none;
        }

        .slide-info h2 {
            font-size: 28px; text-transform: uppercase; letter-spacing: 2px; margin: 0;
        }
    </style>
</head>
<body>

    <section class="seccion-carrusel">
        <h2 class="titulo-seccion">GALERIA DE ARTISTAS</h2>
        
        <div class="carrusel-container">
            <button class="carrusel-btn btn-prev" onclick="moverCarrusel(-1)">❮</button>
            <button class="carrusel-btn btn-next" onclick="moverCarrusel(1)">❯</button>
            
            <div class="carrusel-track" id="track">
                
                <!-- Diapositiva 1 -->
                <div class="carrusel-slide">
                    <img src="clooy.jpeg" alt="Modelo 1">
                    <div class="slide-info"></div>
                </div>

                <!-- Diapositiva 2 -->
                <div class="carrusel-slide">
                    <img src="ARTISTA 2.jpeg" alt="Modelo 2">
                    <div class="slide-info"></div>
                </div>

                <!-- Diapositiva 3 -->
                <div class="carrusel-slide">
                    <img src="ARTISTA 3.jpeg" alt="Modelo 3">
                    <div class="slide-info"></div>
                </div>

                <!-- Diapositiva 4 -->
                <div class="carrusel-slide">
                    <img src="ARTISTA 4.jpeg" alt="Modelo 4">
                    <div class="slide-info"></div>
                </div>

                <!-- Diapositiva 5 -->
                <div class="carrusel-slide">
                    <img src="ARTISTA 5.jpeg" alt="Modelo 5">
                    <div class="slide-info"></div>
                </div>
                    
                <!-- Diapositiva 6 -->
                <div class="carrusel-slide">
                    <img src="artista 6.jpeg" alt="Modelo 6">
                    <div class="slide-info"></div>
                </div>

                <!-- Diapositiva 7 -->
                <div class="carrusel-slide">
                    <img src="logo-2.png" alt="Modelo 7">
                    <div class="slide-info"></div>
                </div>

            </div>
        </div>
    </section>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if(sidebar) sidebar.classList.toggle('active');
        }

        let indiceActual = 0;
        // CORREGIDO: Dinámico para detectar el número exacto de slides en HTML
        const slides = document.querySelectorAll('.carrusel-slide');
        const totalSlides = slides.length;
        const track = document.getElementById('track');

        function moverCarrusel(direccion) {
            indiceActual += direccion;
            if (indiceActual < 0) indiceActual = totalSlides - 1;
            if (indiceActual >= totalSlides) indiceActual = 0;
            
            // CORREGIDO: Desplazamiento calculado de forma automática según la cantidad real de diapositivas
            const porcentajeDesplazamiento = indiceActual * (100 / totalSlides);
            track.style.transform = `translateX(-${porcentajeDesplazamiento}%)`;
        }

        // Cambio automático cada 5 segundos
        setInterval(() => moverCarrusel(1), 5000);
    </script>
</body>
</html>
