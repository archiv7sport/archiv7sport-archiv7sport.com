<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo-2.png">

    <title>Carrito archiv</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; padding: 30px; }
        .contenedor { max-width: 600px; margin: 0 auto; background: #2b2b2b; padding: 20px; border-radius: 8px; }
        .item-carrito { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #444; }
        .info-item { display: flex; flex-direction: column; gap: 4px; }
        .talla-badge { font-size: 12px; color: #aaa; }
        .total { font-size: 1.5em; font-weight: bold; margin-top: 20px; text-align: right; }
        .btn { display: inline-block; padding: 10px 20px; color: white; text-decoration: none; border-radius: 4px; margin-top: 20px; cursor: pointer; text-align: center;}
        .btn-volver { background: #555; }
        .btn-vaciar { background: #dc3545; border: none; }
        .btn-comprar { background: #0a8754; text-decoration: none; }

        @media (max-width: 768px) {
            body { padding: 10px; font-size: 14px; }
            img { max-width: 100%; height: auto; }
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Tu Carrito🛒</h1>
    
    <div id="lista-productos"></div>
    
    <div class="total" id="precio-total">Total: $0</div>
    
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-volver">← Seguir Comprando</a>
        <button onclick="limpiarCarrito()" class="btn btn-vaciar">Vaciar Carrito</button>
        <a href="pagos.html" class="btn btn-comprar">Comprar →</a>
    </div>
</div>

<script>
    function mostrarCarrito() {
        // Lee exactamente la clave 'miCarrito'
        let carrito = JSON.parse(localStorage.getItem('miCarrito')) || [];
        let contenedor = document.getElementById('lista-productos');
        let totalElemento = document.getElementById('precio-total');
        
        contenedor.innerHTML = ""; 
        let sumaTotal = 0;
        
        if(carrito.length === 0) {
            contenedor.innerHTML = "<p>No has agregado ningún producto todavía.</p>";
            totalElemento.innerText = "Total: $0";
            return;
        }
        
        // Renderiza los productos con su cantidad y talla
        carrito.forEach(item => {
            const subtotal = item.precio * item.cantidad;
            sumaTotal += subtotal;

            contenedor.innerHTML += `
                <div class="item-carrito">
                    <div class="info-item">
                        <strong>${item.nombre}</strong>
                        <span class="talla-badge">Talla: ${item.talla} | Cantidad: ${item.cantidad}</span>
                    </div>
                    <span>$${subtotal.toLocaleString()}</span>
                </div>
            `;
        });
        
        totalElemento.innerText = `Total: $${sumaTotal.toLocaleString()}`;
    }

    function limpiarCarrito() {
        localStorage.removeItem('miCarrito');
        mostrarCarrito();
    }

    window.onload = mostrarCarrito;
</script>

</body>
</html>
